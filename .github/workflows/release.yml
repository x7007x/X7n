name: Build & Release APK

on:
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release
      version_name:
        description: "Version name override (e.g. 1.2.0). Leave empty to keep the current one."
        required: false
        type: string
      version_code:
        description: "Version code override (e.g. 5). Leave empty to keep the current one."
        required: false
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: android-app

      - name: Apply version overrides
        if: github.event.inputs.version_name != '' || github.event.inputs.version_code != ''
        run: |
          FILE="android-app/app/build.gradle.kts"
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            sed -i "s/versionName = \"[^\"]*\"/versionName = \"${{ github.event.inputs.version_name }}\"/" "$FILE"
          fi
          if [ -n "${{ github.event.inputs.version_code }}" ]; then
            sed -i "s/versionCode = [0-9]\+/versionCode = ${{ github.event.inputs.version_code }}/" "$FILE"
          fi

      - name: Get version from build.gradle.kts
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android-app/app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' android-app/app/build.gradle.kts)
          echo "name=$VERSION_NAME"         >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE"         >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME"         >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          TYPE_CAP="$(tr '[:lower:]' '[:upper:]' <<< "${BUILD_TYPE:0:1}")${BUILD_TYPE:1}"
          ./gradlew "assemble${TYPE_CAP}" "bundle${TYPE_CAP}" --stacktrace
        working-directory: android-app
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Collect build outputs
        id: outputs
        run: |
          V=${{ steps.version.outputs.name }}

          APK_SRC="android-app/app/build/outputs/apk/${BUILD_TYPE}"
          for f in "$APK_SRC"/*.apk; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            abi=$(echo "$base" | sed -n "s/^app-\(.*\)-${BUILD_TYPE}\.apk$/\1/p")
            if [ "$abi" = "universal" ] || [ -z "$abi" ]; then
              new="egyptology-${V}-${BUILD_TYPE}.apk"
              echo "apk_primary=$new" >> "$GITHUB_OUTPUT"
            else
              new="egyptology-${V}-${BUILD_TYPE}-${abi}.apk"
            fi
            cp "$f" "$new"
          done

          AAB_SRC="android-app/app/build/outputs/bundle/${BUILD_TYPE}"
          aab=$(find "$AAB_SRC" -name "*.aab" | head -n1)
          cp "$aab" "egyptology-${V}-${BUILD_TYPE}.aab"

          echo "pattern=egyptology-*" >> "$GITHUB_OUTPUT"
          echo "aab_primary=egyptology-${V}-${BUILD_TYPE}.aab" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: env.BUILD_TYPE == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Egyptology Encyclopedia ${{ steps.version.outputs.tag }}

          ### Changes
          ${{ github.event.head_commit.message || format('Manual build ({0})', env.BUILD_TYPE) }}

          ---
          **Version code:** `${{ steps.version.outputs.code }}`
          **Published:** `${{ steps.version.outputs.timestamp }}`
          **Commit:** `${{ github.sha }}`
          EOF
          TAG="${{ steps.version.outputs.tag }}"
          TITLE="egyptology $TAG"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --title "$TITLE" --notes-file release-notes.md
            gh release upload "$TAG" --repo "${{ github.repository }}" ${{ steps.outputs.outputs.pattern }} --clobber
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --title "$TITLE" --notes-file release-notes.md ${{ steps.outputs.outputs.pattern }}
          fi

      - name: Upload build artifact
        if: env.BUILD_TYPE == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: egyptology-${{ steps.version.outputs.name }}-${{ env.BUILD_TYPE }}
          path: ${{ steps.outputs.outputs.pattern }}

      - name: Send build via Telegram
        if: success() && env.TG_TOKEN != '' && env.TG_CHAT != ''
        run: |
          APK="${{ steps.outputs.outputs.apk_primary }}"
          AAB="${{ steps.outputs.outputs.aab_primary }}"
          CAPTION="#Egyptology #v${{ steps.version.outputs.name }} #${{ steps.version.outputs.code }}"
          if [ -f "$APK" ]; then
            curl -s -F "chat_id=$TG_CHAT" \
                 -F "document=@$APK" \
                 -F "caption=$CAPTION" \
                 "https://api.telegram.org/bot$TG_TOKEN/sendDocument"
          fi
          if [ -f "$AAB" ]; then
            curl -s -F "chat_id=$TG_CHAT" \
                 -F "document=@$AAB" \
                 -F "caption=$CAPTION" \
                 "https://api.telegram.org/bot$TG_TOKEN/sendDocument"
          fi

      - name: Notify Telegram on failure
        if: failure() && env.TG_TOKEN != '' && env.TG_CHAT != ''
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT=$(printf '*Egyptology build failed* ⚠️\n\n*Type:* `%s`\n*Branch:* `%s`\n*Commit:* `%s`\n*Triggered by:* %s\n\n[View run logs](%s)' \
            "$BUILD_TYPE" "${{ github.ref_name }}" "${{ github.sha }}" "${{ github.actor }}" "$RUN_URL")
          curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
               -d "chat_id=$TG_CHAT" \
               -d "parse_mode=Markdown" \
               -d "disable_web_page_preview=true" \
               --data-urlencode "text=$TEXT"
