name: Android Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      app_version:
        description: "App Version (e.g. 1.0.0 or 1.2.3)"
        required: false
        default: "1.0.0"
        type: string
      build_type:
        description: "Build Type (Release or Debug)"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
      package_format:
        description: "Package Format (APK, AAB, or Both)"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - apk
          - aab
      create_release:
        description: "Publish artifacts to GitHub Releases"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare env file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Prepare Keystores (Debug and Release)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          # 1. Guarantee debug.keystore exists in the root directory
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > "$GITHUB_WORKSPACE/debug.keystore"
          elif [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/debug.keystore" \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug, O=Android, C=US"
          fi

          # 2. Guarantee release keystore exists
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/my-upload-key.jks"
            echo "STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=upload" >> "$GITHUB_ENV"
          elif [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > "$GITHUB_WORKSPACE/my-upload-key.jks"
            echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/my-upload-key.jks" \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Egyptology, OU=Dev, O=Egyptology, L=Cairo, S=Egypt, C=EG"
            echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=upload" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"
          ls -la "$GITHUB_WORKSPACE"/*.keystore "$GITHUB_WORKSPACE"/*.jks 2>/dev/null || true

      - name: Determine Version and Tasks
        id: config
        run: |
          INPUT_VER="${{ github.event.inputs.app_version }}"
          if [ -n "$INPUT_VER" ]; then
            CLEAN_VER="${INPUT_VER#v}"
            TAG_NAME="v$CLEAN_VER"
            VERSION_NAME="$CLEAN_VER"
          elif [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_TAG="${{ github.ref_name }}"
            TAG_NAME="$RAW_TAG"
            VERSION_NAME="${RAW_TAG#v}"
          else
            VERSION_NAME="1.0.0"
            TAG_NAME="v1.0.0-$(date +'%Y%m%d%H%M')"
          fi

          # Compute numeric versionCode (e.g., 1.0.2 -> 10002 or fallback)
          NUMERIC_CODE=$(echo "$VERSION_NAME" | awk -F. '{ if (NF>=3) printf("%d%02d%02d", $1, $2, $3); else if (NF==2) printf("%d%02d00", $1, $2); else printf("%d0000", $1); }' 2>/dev/null || echo "1")
          if [ -z "$NUMERIC_CODE" ] || [ "$NUMERIC_CODE" -le 0 ] 2>/dev/null; then
            NUMERIC_CODE=1
          fi

          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          PACKAGE_FORMAT="${{ github.event.inputs.package_format || 'both' }}"

          # Defaults on tag push
          if [ "${{ github.event_name }}" = "push" ]; then
            BUILD_TYPE="release"
            PACKAGE_FORMAT="both"
          fi

          TASKS=""
          if [ "$BUILD_TYPE" = "debug" ]; then
            if [ "$PACKAGE_FORMAT" = "apk" ]; then
              TASKS="assembleDebug"
            elif [ "$PACKAGE_FORMAT" = "aab" ]; then
              TASKS="bundleDebug"
            else
              TASKS="assembleDebug bundleDebug"
            fi
          else
            if [ "$PACKAGE_FORMAT" = "apk" ]; then
              TASKS="assembleRelease"
            elif [ "$PACKAGE_FORMAT" = "aab" ]; then
              TASKS="bundleRelease"
            else
              TASKS="assembleRelease bundleRelease"
            fi
          fi

          echo "Selected Build Type: $BUILD_TYPE"
          echo "Selected Package Format: $PACKAGE_FORMAT"
          echo "Executing Gradle Tasks: $TASKS"
          echo "Version Name: $VERSION_NAME ($NUMERIC_CODE), Tag: $TAG_NAME"

          echo "tasks=$TASKS" >> "$GITHUB_OUTPUT"
          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$NUMERIC_CODE" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_title=Release $TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$NUMERIC_CODE" >> "$GITHUB_ENV"

      - name: Build Android Package
        run: |
          gradle ${{ steps.config.outputs.tasks }} \
            -PversionName="${{ steps.config.outputs.version_name }}" \
            -PversionCode="${{ steps.config.outputs.version_code }}" \
            -Djava.awt.headless=true \
            --stacktrace \
            --no-configuration-cache

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-${{ steps.config.outputs.build_type }}-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore

      - name: Upload AAB (App Bundle) Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-${{ steps.config.outputs.build_type }}-aab
          path: app/build/outputs/bundle/**/*.aab
          if-no-files-found: ignore

      - name: Upload to tmpfiles.org
        id: upload_tmpfiles
        run: |
          echo "### 📦 Direct Download Links (tmpfiles.org)" >> "$GITHUB_STEP_SUMMARY"
          
          # Find and upload APKs
          find app/build/outputs/apk -type f -name "*.apk" 2>/dev/null | while read -r apk_file; do
            FILE_NAME=$(basename "$apk_file")
            echo "Uploading $FILE_NAME to tmpfiles.org..."
            RESPONSE=$(curl -s -F "file=@$apk_file" https://tmpfiles.org/api/v1/upload || true)
            URL=$(echo "$RESPONSE" | grep -o '"url":"[^"]*' | cut -d'"' -f4 || true)
            if [ -n "$URL" ]; then
              # Convert download page URL to direct download URL (tmpfiles.org/XXXX -> tmpfiles.org/dl/XXXX)
              DL_URL=$(echo "$URL" | sed 's|tmpfiles.org/|tmpfiles.org/dl/|')
              echo "✅ $FILE_NAME: $DL_URL"
              echo "- **APK ($FILE_NAME)**: [$DL_URL]($DL_URL)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "⚠️ Failed to upload $FILE_NAME: $RESPONSE"
            fi
          done

          # Find and upload AABs
          find app/build/outputs/bundle -type f -name "*.aab" 2>/dev/null | while read -r aab_file; do
            FILE_NAME=$(basename "$aab_file")
            echo "Uploading $FILE_NAME to tmpfiles.org..."
            RESPONSE=$(curl -s -F "file=@$aab_file" https://tmpfiles.org/api/v1/upload || true)
            URL=$(echo "$RESPONSE" | grep -o '"url":"[^"]*' | cut -d'"' -f4 || true)
            if [ -n "$URL" ]; then
              DL_URL=$(echo "$URL" | sed 's|tmpfiles.org/|tmpfiles.org/dl/|')
              echo "✅ $FILE_NAME: $DL_URL"
              echo "- **AAB ($FILE_NAME)**: [$DL_URL]($DL_URL)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "⚠️ Failed to upload $FILE_NAME: $RESPONSE"
            fi
          done

      - name: Publish to GitHub Releases
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release != 'false') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.config.outputs.tag_name }}
          name: ${{ steps.config.outputs.release_title }}
          draft: false
          prerelease: ${{ steps.config.outputs.build_type == 'debug' }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
